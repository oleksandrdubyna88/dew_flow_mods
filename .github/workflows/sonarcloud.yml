name: sonarcloud

# SonarCloud analysis of the node tools and the plugin's hooks with the generic scanner. Not a required check.
# The scan needs SONAR_TOKEN, which a pull request from a fork does not get; the job is red there and says so.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Coverage of the tools from node's own runner. The plugin's tests run in the engine's runner (no lcov).
      - name: Test with coverage
        run: |
          npm ci --ignore-scripts
          mkdir -p coverage
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage/lcov.info "tools/*.test.mjs"
      # Pinned to a sha, and to v8 (v4 and v5 carry an argument-injection advisory).
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
