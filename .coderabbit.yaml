# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit for dew_flow_mods — a Claude Code plugin marketplace (plugins/agent-models) and the small node
# tools that prove the copy and run in CI (tools/*.mjs).
language: "ru-RU"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
  path_filters:
    - "!**/node_modules/**"
  path_instructions:
    - path: "plugins/**"
      instructions: |
        This code runs with the owner's permissions, outside any sandbox, in every interactive Claude Code
        session on every machine that installs the plugin. A changed file needs a higher `plugin.json`
        version. Flag a network call, a process start, a file write outside the plugin's own state, a
        dependency, or an install script.
    - path: "tools/*.mjs"
      instructions: |
        Node ESM run in CI on Linux: only node: builtins, no shell globs, paths built with node:path,
        exit code 1 with a named finding on failure and 0 with the finding printed on success. Every tool
        has a test beside it that was seen red first.
    - path: ".github/workflows/*.yml"
      instructions: |
        Triggers are `pull_request` and `push`, never `pull_request_target`; the token is read-only; every
        `uses:` is pinned to a full commit sha with the tag in a comment; `npm ci --ignore-scripts`.
  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
