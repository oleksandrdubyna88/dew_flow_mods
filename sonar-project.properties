sonar.projectKey=remsoftdev_dew_flow_mods
sonar.organization=remsoftdev
sonar.projectName=dew_flow_mods
# The tools that prove the copy and the hooks of the plugin. The plugin's own tests run in the Claude Code engine's
# runner (`claude plugin test`), which writes no lcov, so the plugin is excluded from coverage: a recorded gap.
sonar.sources=tools,plugins/agent-models/hooks
sonar.tests=tools
sonar.test.inclusions=tools/**/*.test.mjs
sonar.exclusions=**/node_modules/**
sonar.coverage.exclusions=plugins/**
sonar.sourceEncoding=UTF-8
# Coverage of the tools, from node's own test runner (--experimental-test-coverage, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
